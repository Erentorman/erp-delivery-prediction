# ============================================================
# ERP Delivery Prediction — Docker Compose Service Skeleton
# T-104: Configure Docker Compose Service Skeleton
#
# Communication topology:
#   frontend  → api
#   api       → postgres
#   api       → mock-erp
#   api       → ai-prediction
#
# Publicly exposed ports (dev only):
#   frontend  → ${FRONTEND_PORT:-3000}
#   api       → ${API_PORT:-5000}  (Swagger / dev access)
#
# Not publicly exposed:
#   postgres, mock-erp, ai-prediction
# ============================================================

services:

  # ----------------------------------------------------------
  # frontend — React + Vite + TypeScript SPA
  # Served by Nginx inside the container.
  # Only service with a user-facing published port.
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # VITE_* variables are build-time values: Vite inlines them
        # statically into the bundle during `npm run build`.
        # They MUST be passed as Docker build ARGs, NOT runtime env vars.
        # See frontend/Dockerfile for the ARG → ENV → RUN npm run build chain.
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:5000}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - erp-net
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ----------------------------------------------------------
  # api — ASP.NET Core Web API (App.Api)
  # Composition root; connects to postgres, mock-erp,
  # and ai-prediction exclusively over the internal network.
  # API/Swagger port is published for development only.
  # ----------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: src/App.Api/Dockerfile
    ports:
      - "${API_PORT:-5000}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING:-Host=postgres;Port=5432;Database=erp_delivery;Username=erp_user;Password=change_me_postgres_password}
      - Jwt__Secret=${JWT_SECRET:-change_me_jwt_secret_at_least_32_characters_long}
      - Jwt__Issuer=${JWT_ISSUER:-erp-delivery-prediction}
      - Jwt__Audience=${JWT_AUDIENCE:-erp-delivery-prediction-clients}
      # Config key is MockErp:BaseAddress (see MockErpOptions.cs) — the
      # env var name must match exactly for IConfiguration binding.
      - MockErp__BaseAddress=${MOCK_ERP_BASE_URL:-http://mock-erp:8080}
      - AiPrediction__BaseUrl=${AI_PREDICTION_BASE_URL:-http://ai-prediction:8000}
      - AiPrediction__TimeoutMs=${AI_PREDICTION_TIMEOUT_MS:-3000}
      - Cors__AllowedOrigin=${CORS_ALLOWED_ORIGIN:-http://localhost:3000}
      # T-388 opt-in demo mechanism: injects a synthetic, clearly-labelled
      # DEMO-* work order/routing when the ERP snapshot has none, so local/demo
      # Docker environments can produce a prediction despite mock-erp-seed.json
      # having zero real WorkOrders. Never overrides real ERP WorkOrder data.
      - Demo__EnableSyntheticWorkOrder=${DEMO_ENABLE_SYNTHETIC_WORK_ORDER:-true}
    networks:
      - erp-net
    depends_on:
      postgres:
        condition: service_healthy
      mock-erp:
        condition: service_healthy
      # api has no runtime code path that calls ai-prediction yet
      # (AddPredictionServices only wires Rule-Based + CPM); keep this
      # as service_started so a future AI integration doesn't have to
      # add it, but don't gate api startup on ai-prediction health for
      # a dependency that doesn't exist today.
      ai-prediction:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ----------------------------------------------------------
  # postgres — Application database (PostgreSQL 18)
  # NOT publicly exposed.
  # Health check ensures dependents wait until DB is ready.
  # ----------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-erp_delivery}
      - POSTGRES_USER=${POSTGRES_USER:-erp_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me_postgres_password}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - erp-net
    # No "ports:" block → not reachable from the host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp_user} -d ${POSTGRES_DB:-erp_delivery}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ----------------------------------------------------------
  # mock-erp — Read-only Mock ERP API (MockErp.Api)
  # NOT publicly exposed.
  # Serves static JSON seed data consumed only by api.
  # ----------------------------------------------------------
  mock-erp:
    build:
      context: .
      dockerfile: src/MockErp.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:8080
    networks:
      - erp-net
    # No "ports:" block → not reachable from the host
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ----------------------------------------------------------
  # ai-prediction — Python + FastAPI AI Prediction Service
  # NOT publicly exposed.
  # Exposes /health endpoint on internal port 8000.
  # /predict endpoint will be added once T-105 is completed.
  # ----------------------------------------------------------
  ai-prediction:
    build:
      context: ./ai-prediction
      dockerfile: Dockerfile
    environment:
      - PORT=${AI_PORT:-8000}
      - MODEL_PATH=${AI_MODEL_PATH:-/app/models/model.pkl}
      - FEATURE_SCHEMA_VERSION=${AI_FEATURE_SCHEMA_VERSION:-1}
      - MODEL_VERSION=${AI_MODEL_VERSION:-1}
      - TRAINING_DATASET_VERSION=${AI_TRAINING_DATASET_VERSION:-1}
    networks:
      - erp-net
    # No "ports:" block → not reachable from the host
    # Healthcheck is informational (visible in `docker compose ps`) only;
    # api does not depend on this service's health — see api's depends_on.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ----------------------------------------------------------
  # ready — prints a clear, copy/paste-able "stack is ready" banner
  # once frontend and api are up, then exits. No other role: lets a
  # plain `docker compose up` be the single command a developer needs
  # to discover where the app is running, without a wrapper script.
  # ----------------------------------------------------------
  ready:
    image: busybox:1.36
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    command:
      - sh
      - -c
      - >
        echo "================================================" &&
        echo "ERP Delivery Prediction is ready" &&
        echo "" &&
        echo "Frontend: http://localhost:${FRONTEND_PORT:-3000}" &&
        echo "API:      http://localhost:${API_PORT:-5000}" &&
        echo "Swagger:  http://localhost:${API_PORT:-5000}/swagger" &&
        echo "================================================"

# ============================================================
# Networks
#
# T-104 originally set `internal: true` to keep erp-net fully
# isolated from outbound traffic. That setting was changed for
# local development (Docker startup/optimization task) because it
# also blocks host -> container access on *published* ports:
# verified empirically — a container on an `internal: true` bridge
# network returns connection-refused on its published port from the
# host, while the same container on a normal bridge network responds
# normally. Since frontend/api must be reachable from the host
# browser (docker compose up, no manual `dotnet run`/`npm run dev`),
# `internal: true` is incompatible with this task's goal and has been
# removed.
#
# Trade-off: postgres, mock-erp and ai-prediction now also have
# outbound internet access (they did not before). None of them
# currently need it, but a single flat bridge network is the
# simplest structure for local dev; a split public/private network
# is not introduced unless a real security or connectivity problem
# is found with this single-network setup.
# ============================================================
networks:
  erp-net:
    driver: bridge

# ============================================================
# Volumes
# ============================================================
volumes:
  postgres-data:
